name: CI

# All workflow logic lives in mkadrlik/actions-workflows
# This file wires up triggers and passes repo-specific inputs

on:
  push:
    branches: [main, "fix/*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild even if image exists"
        required: false
        type: boolean
        default: false
      release_type:
        description: "Release type (auto, major, minor, patch)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - major
          - minor
          - patch

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: mkadrlik/actions-workflows/.gitea/workflows/validate-commits.yml@main

  build:
    uses: mkadrlik/actions-workflows/.gitea/workflows/build-docker.yml@main
    with:
      image_name: mkadrlik/llama-cpp-rocm-tq
      runs_on: rocm
      upstream_repo: https://github.com/TheTom/llama-cpp-turboquant.git
      upstream_branch: feature/turboquant-kv-cache
      check_upstream: true
      has_mirror: true
    secrets:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  semver:
    if: github.event_name == 'workflow_dispatch'
    uses: mkadrlik/actions-workflows/.gitea/workflows/semver-release.yml@main
    with:
      image_name: mkadrlik/llama-cpp-rocm-tq
      repo_name: llama-cpp-rocm-tq
      runs_on: rocm
    secrets:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
